<svg width="680" height="500" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>GC Gaming Center Logo</title>
  <desc>Logo Gaming Center blanco con joystick centrado</desc>

  <!-- Card fondo blanco con borde azul -->
  <rect x="140" y="20" width="400" height="460" rx="28" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Acento top -->
  <rect x="140" y="20" width="400" height="8" rx="4" fill="#2563eb"/>

  <!-- TEXTO GC -->
  <text x="340" y="110" text-anchor="middle"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900" font-size="80" letter-spacing="10"
    fill="#1e40af">GC</text>

  <!-- Línea separadora -->
  <rect x="220" y="122" width="240" height="3" rx="1.5" fill="#e5e7eb"/>
  <rect x="290" y="122" width="100" height="3" rx="1.5" fill="#f59e0b"/>

  <!-- Subtítulo -->
  <text x="340" y="155" text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="700" font-size="13" letter-spacing="7"
    fill="#6b7280">GAMING CENTER</text>

  <!-- Cuerpo principal del joystick -->
  <rect x="210" y="190" width="260" height="140" rx="40" fill="#1e40af"/>
  <rect x="210" y="190" width="260" height="140" rx="40" fill="none" stroke="#2563eb" stroke-width="2"/>

  <!-- Reflejo superior -->
  <rect x="225" y="200" width="230" height="22" rx="11" fill="#2563eb" opacity="0.35"/>

  <!-- Bumper L -->
  <rect x="220" y="184" width="70" height="18" rx="9" fill="#1e3a8a"/>
  <text x="255" y="197" text-anchor="middle"
    font-family="Arial, sans-serif" font-weight="700" font-size="10"
    fill="#bfdbfe">LB</text>

  <!-- Bumper R -->
  <rect x="390" y="184" width="70" height="18" rx="9" fill="#1e3a8a"/>
  <text x="425" y="197" text-anchor="middle"
    font-family="Arial, sans-serif" font-weight="700" font-size="10"
    fill="#bfdbfe">RB</text>

  <!-- D-Pad -->
  <rect x="254" y="250" width="32" height="10" rx="3" fill="#f59e0b"/>
  <rect x="264" y="240" width="12" height="32" rx="3" fill="#f59e0b"/>

  <!-- Botones START / SELECT -->
  <rect x="316" y="255" width="20" height="8" rx="4" fill="#93c5fd"/>
  <rect x="344" y="255" width="20" height="8" rx="4" fill="#93c5fd"/>

  <!-- Botón Y (arriba) -->
  <circle cx="410" cy="240" r="9" fill="#f59e0b"/>
  <text x="410" y="244" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="#1e40af">Y</text>
  <!-- Botón X (izquierda) -->
  <circle cx="399" cy="256" r="9" fill="#ffffff"/>
  <text x="399" y="260" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="#1e40af">X</text>
  <!-- Botón B (derecha) -->
  <circle cx="421" cy="256" r="9" fill="#ef4444"/>
  <text x="421" y="260" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="#ffffff">B</text>
  <!-- Botón A (abajo) -->
  <circle cx="410" cy="272" r="9" fill="#22c55e"/>
  <text x="410" y="276" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="#ffffff">A</text>

  <!-- Analógico izquierdo -->
  <circle cx="278" cy="298" r="16" fill="#0f172a"/>
  <circle cx="278" cy="298" r="11" fill="#1e293b"/>
  <circle cx="281" cy="295" r="4" fill="#334155"/>

  <!-- Analógico derecho -->
  <circle cx="402" cy="298" r="16" fill="#0f172a"/>
  <circle cx="402" cy="298" r="11" fill="#1e293b"/>
  <circle cx="405" cy="295" r="4" fill="#334155"/>

  <!-- Cables -->
  <path d="M278 330 Q278 360 258 370" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <path d="M402 330 Q402 360 422 370" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>

  <!-- Plugs -->
  <rect x="240" y="368" width="18" height="10" rx="3" fill="#1e3a8a"/>
  <rect x="420" y="368" width="18" height="10" rx="3" fill="#1e3a8a"/>

  <!-- Línea decorativa inferior -->
  <rect x="220" y="405" width="240" height="2" rx="1" fill="#e5e7eb"/>

  <!-- Tagline -->
  <text x="340" y="430" text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="400" font-size="11" letter-spacing="3"
    fill="#9ca3af">LEVEL UP YOUR GAME</text>

  <!-- Pixel dots decorativos -->
  <rect x="162" y="220" width="5" height="5" fill="#2563eb" opacity="0.5"/>
  <rect x="170" y="220" width="5" height="5" fill="#f59e0b" opacity="0.5"/>
  <rect x="162" y="228" width="5" height="5" fill="#f59e0b" opacity="0.5"/>
  <rect x="170" y="228" width="5" height="5" fill="#2563eb" opacity="0.5"/>

  <rect x="506" y="220" width="5" height="5" fill="#2563eb" opacity="0.5"/>
  <rect x="514" y="220" width="5" height="5" fill="#f59e0b" opacity="0.5"/>
  <rect x="506" y="228" width="5" height="5" fill="#f59e0b" opacity="0.5"/>
  <rect x="514" y="228" width="5" height="5" fill="#2563eb" opacity="0.5"/>

  <!-- Acento bottom -->
  <rect x="140" y="472" width="400" height="8" rx="4" fill="#f59e0b"/>

</svg>
